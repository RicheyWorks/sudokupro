# Full CI (AUDIT P1-6): build, run the entire test suite, and prove the Docker
# image actually builds. Replaces test-constants.yml, which exercised one test.
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    # Most server tests run on H2 via the test profile. Two classes cannot:
    # FlywayMigrationTest runs the real V1-V9 chain (PL/pgSQL DO blocks, ADD GENERATED
    # AS IDENTITY, partial unique indexes — none of which H2 can check) and
    # CrossReplicaBroadcastTest needs real Redis pub/sub to prove a broadcast on one pod
    # reaches a session on another. Both used to be @Testcontainers(disabledWithoutDocker),
    # which meant they silently disabled themselves here and everywhere else, and both
    # subsystems shipped unverified. Real services now back them, and an outage is a red
    # build rather than a skip.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: sudoku123
          POSTGRES_DB: sudokupro
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Full suite across all modules (model/server/client). DB_PASSWORD/REDIS_* are the
      # same environment variables application.properties reads, so nothing test-specific
      # is hard-coded; the H2 test profile overrides the datasource for every other test.
      # sudokupro.it.optional is deliberately NOT set: the services above are guaranteed,
      # so an unreachable one must fail the build.
      - name: Build and test
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USERNAME: postgres
          DB_PASSWORD: sudoku123
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
        run: mvn -B verify

      # Belt and braces for the exact failure this replaced: a test that counts as passing
      # while never executing. If either class is missing from the reports, or reports a
      # skip, or ran zero tests, the build fails and says so.
      - name: Prove the real-service tests actually executed
        if: always()
        run: |
          set -euo pipefail
          status=0
          for cls in com.xai.sudokupro.db.FlywayMigrationTest \
                     com.xai.sudokupro.websocket.CrossReplicaBroadcastTest; do
            report="server/target/surefire-reports/TEST-${cls}.xml"
            if [ ! -f "$report" ]; then
              echo "::error::${cls} produced no surefire report — it did not run at all"
              status=1; continue
            fi
            tests=$(grep -o 'tests="[0-9]*"' "$report" | head -1 | grep -o '[0-9]*')
            skipped=$(grep -o 'skipped="[0-9]*"' "$report" | head -1 | grep -o '[0-9]*')
            echo "${cls}: tests=${tests} skipped=${skipped}"
            if [ "${tests:-0}" -eq 0 ] || [ "${skipped:-0}" -ne 0 ]; then
              echo "::error::${cls} ran ${tests} test(s) with ${skipped} skipped — this subsystem must be verified, not skipped"
              status=1
            fi
          done
          exit $status

  # The three out-of-process harnesses. The JUnit suite above cannot reach what
  # these do: the engine drives the real model through whole games looking for
  # invariant violations, and the two Python suites attack a genuinely running
  # server over HTTP and raw WebSocket. Most of the P0s in BUG_AUDIT_2026-07-24.md
  # were found by these and by nothing else — the nested-lock stall, the WebSocket
  # move-parsing break, the /solve ownership hole and the /end replay farm all had
  # green unit tests over them. Running them only by hand meant a regression could
  # land on main unnoticed.
  harness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: sudoku123
          POSTGRES_DB: sudokupro
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the parent POM and the model module
        run: |
          mvn -B -N install -DskipTests
          mvn -B -pl model install -DskipTests

      # Engine.java is a single-file source-launch program, not a Maven module, so
      # it needs the model's runtime dependencies resolved onto the classpath.
      - name: Model engine — invariants over real gameplay, in process
        run: |
          mvn -B -q -pl model dependency:build-classpath \
            -Dmdep.outputFile=/tmp/model-cp.txt -DincludeScope=runtime
          java -cp "model/target/classes:$(cat /tmp/model-cp.txt)" engine/Engine.java

      - name: Build the server jar
        run: mvn -B -q -pl server -am package -DskipTests

      # The dev profile keeps Spring Security enabled, which the adversarial suite
      # depends on — the "test" profile disables SecurityConfig outright and would
      # turn every authorization assertion green for the wrong reason.
      - name: Start the server
        run: |
          nohup java -jar server/target/sudokupro-server-*-exec.jar \
            --spring.profiles.active=dev > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health)" = "200" ]; then
              echo "server healthy after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "::error::server did not become healthy"; tail -100 /tmp/server.log; exit 1

      - name: Adversarial API suite — authorization and replay checks
        run: python3 testing/adversarial_api_test.py

      # The live engine plays complete games against the running server over the same
      # REST + WebSocket API the real clients use. It is the only harness that can see
      # what the in-process one structurally cannot: authorization, the economy under
      # concurrency, persistence across cache eviction, and the realtime layer. It caught
      # three server bugs on its first full run.
      - name: Live game-playing engine — full games over REST + WebSocket
        run: |
          pip install --quiet websockets
          python3 engine/live_engine.py --players 8 --games-per-player 3

      - name: Fuzz and edge-case suite — 28 checks incl. hostile WebSocket frames
        run: |
          pip install --quiet websockets
          python3 testing/fuzz_edge_cases.py

      - name: Server log
        if: always()
        run: tail -200 /tmp/server.log || true

      - name: Stop the server
        if: always()
        run: kill "$(cat /tmp/server.pid)" 2>/dev/null || true

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sudokupro:${{ github.sha }} .

  # Release: on a version tag (v*), publish the server jar as a GitHub Release
  # and push the Docker image to GHCR tagged with the version.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, harness, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build server jar
        run: mvn -B -DskipTests -pl server -am package

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          IMAGE=ghcr.io/${{ github.repository_owner }}/sudokupro
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: server/target/sudokupro-server-*-exec.jar
