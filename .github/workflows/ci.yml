# Full CI (AUDIT P1-6): build, run the entire test suite, and prove the Docker
# image actually builds. Replaces test-constants.yml, which exercised one test.
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    # Most server tests run on H2 via the test profile. Two classes cannot:
    # FlywayMigrationTest runs the real V1-V9 chain (PL/pgSQL DO blocks, ADD GENERATED
    # AS IDENTITY, partial unique indexes — none of which H2 can check) and
    # CrossReplicaBroadcastTest needs real Redis pub/sub to prove a broadcast on one pod
    # reaches a session on another. Both used to be @Testcontainers(disabledWithoutDocker),
    # which meant they silently disabled themselves here and everywhere else, and both
    # subsystems shipped unverified. Real services now back them, and an outage is a red
    # build rather than a skip.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: sudoku123
          POSTGRES_DB: sudokupro
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Full suite across all modules (model/server/client). DB_PASSWORD/REDIS_* are the
      # same environment variables application.properties reads, so nothing test-specific
      # is hard-coded; the H2 test profile overrides the datasource for every other test.
      # sudokupro.it.optional is deliberately NOT set: the services above are guaranteed,
      # so an unreachable one must fail the build.
      - name: Build and test
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USERNAME: postgres
          DB_PASSWORD: sudoku123
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
        run: mvn -B verify

      # A red build must say WHAT failed. Without this, a failing suite surfaced only as
      # "Process completed with exit code 1" on the job card, and the surefire output that
      # names the test was reachable only by signing in and expanding the step — so a
      # failure that did not reproduce locally could not be diagnosed from the outside at
      # all. Pass 16 hit exactly that: green on two JDKs, with CI's own environment, run
      # through `verify`, and the CI log was the only place the answer existed.
      - name: Report which tests failed
        if: failure()
        run: |
          echo "## Failing tests" >> "$GITHUB_STEP_SUMMARY"
          found=0
          for f in */target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            if grep -qE "FAILURE|ERROR" "$f"; then
              found=1
              echo "::group::$f"
              cat "$f"
              echo "::endgroup::"
              { echo; echo "<details><summary>$(basename "$f")</summary>"; echo; echo '```'; cat "$f"; echo '```'; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          [ "$found" = 1 ] || echo "No surefire failure reports — the build failed before or after the tests." | tee -a "$GITHUB_STEP_SUMMARY"

      # The reports themselves, so a failure can be read without signing in and without
      # re-running anything.
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '*/target/surefire-reports/**'
          retention-days: 7
          if-no-files-found: ignore

      # Belt and braces for the exact failure this replaced: a test that counts as passing
      # while never executing. If either class is missing from the reports, or reports a
      # skip, or ran zero tests, the build fails and says so.
      - name: Prove the real-service tests actually executed
        if: always()
        run: |
          set -euo pipefail
          status=0
          for cls in com.xai.sudokupro.db.FlywayMigrationTest \
                     com.xai.sudokupro.websocket.CrossReplicaBroadcastTest; do
            report="server/target/surefire-reports/TEST-${cls}.xml"
            if [ ! -f "$report" ]; then
              echo "::error::${cls} produced no surefire report — it did not run at all"
              status=1; continue
            fi
            tests=$(grep -o 'tests="[0-9]*"' "$report" | head -1 | grep -o '[0-9]*')
            skipped=$(grep -o 'skipped="[0-9]*"' "$report" | head -1 | grep -o '[0-9]*')
            echo "${cls}: tests=${tests} skipped=${skipped}"
            if [ "${tests:-0}" -eq 0 ] || [ "${skipped:-0}" -ne 0 ]; then
              echo "::error::${cls} ran ${tests} test(s) with ${skipped} skipped — this subsystem must be verified, not skipped"
              status=1
            fi
          done
          exit $status

  # The three out-of-process harnesses. The JUnit suite above cannot reach what
  # these do: the engine drives the real model through whole games looking for
  # invariant violations, and the two Python suites attack a genuinely running
  # server over HTTP and raw WebSocket. Most of the P0s in BUG_AUDIT_2026-07-24.md
  # were found by these and by nothing else — the nested-lock stall, the WebSocket
  # move-parsing break, the /solve ownership hole and the /end replay farm all had
  # green unit tests over them. Running them only by hand meant a regression could
  # land on main unnoticed.
  harness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: sudoku123
          POSTGRES_DB: sudokupro
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the parent POM and the model module
        run: |
          mvn -B -N install -DskipTests
          mvn -B -pl model install -DskipTests

      # Engine.java is a single-file source-launch program, not a Maven module, so
      # it needs the model's runtime dependencies resolved onto the classpath.
      - name: Model engine — invariants over real gameplay, in process
        run: |
          mvn -B -q -pl model dependency:build-classpath \
            -Dmdep.outputFile=/tmp/model-cp.txt -DincludeScope=runtime
          java -cp "model/target/classes:$(cat /tmp/model-cp.txt)" engine/Engine.java

      - name: Build the server jar
        run: mvn -B -q -pl server -am package -DskipTests

      # The dev profile keeps Spring Security enabled, which the adversarial suite
      # depends on — the "test" profile disables SecurityConfig outright and would
      # turn every authorization assertion green for the wrong reason.
      #
      # The registration quota is raised for THIS instance (pass 15). The shipped
      # default is 5 accounts per 600s per address and it counts rejected attempts
      # too, but every harness below creates more than that from one address: the
      # adversarial suite needs ~8 and the live engine needs one per --players. So
      # at the default this job starved two of its three harnesses — measured on the
      # shipped jar, registration #6 onward returned 429. The throttle is not left
      # untested: it gets its own purpose-configured instance in the step below,
      # which is the only place a small quota proves anything.
      - name: Start the server
        run: |
          nohup java -jar server/target/sudokupro-server-*-exec.jar \
            --spring.profiles.active=dev \
            --sudokupro.security.register.max-attempts=500 > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health)" = "200" ]; then
              echo "server healthy after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "::error::server did not become healthy"; tail -100 /tmp/server.log; exit 1

      - name: Adversarial API suite — authorization and replay checks
        run: python3 testing/adversarial_api_test.py

      # The live engine plays complete games against the running server over the same
      # REST + WebSocket API the real clients use. It is the only harness that can see
      # what the in-process one structurally cannot: authorization, the economy under
      # concurrency, persistence across cache eviction, and the realtime layer. It caught
      # three server bugs on its first full run.
      - name: Live game-playing engine — full games over REST + WebSocket
        run: |
          pip install --quiet websockets
          python3 engine/live_engine.py --players 8 --games-per-player 3

      - name: Fuzz and edge-case suite — 28 checks incl. hostile WebSocket frames
        run: |
          pip install --quiet websockets
          python3 testing/fuzz_edge_cases.py

      # The shipped web client had NO test of any kind until pass 17 — no JS tests, no
      # browser driver, and nothing in CI that referenced app.js. Two defects fixed in
      # earlier passes live entirely in that file, and the only way to confirm either was
      # still fixed was to read the source by hand. This plays a whole puzzle through the
      # real UI in real Chromium and asserts the player-facing outcome.
      #
      # It runs against the jar built above, which is built from this checkout — so the
      # browser always gets the app.js in the commit under test. Running a server built
      # earlier would serve the OLD client out of its jar and quietly test nothing, which
      # is exactly how the harness's first mutation audit came back falsely green.
      - name: Web client suite — a real browser plays a real game
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 testing/web_client_test.py

      - name: Server log
        if: always()
        run: tail -200 /tmp/server.log || true

      - name: Stop the server
        if: always()
        run: kill "$(cat /tmp/server.pid)" 2>/dev/null || true

      # The registration throttle, on its own instance (pass 15). L32 reads the quota
      # in force rather than assuming one, and skips when it is too high to exercise —
      # so on the raised-quota instance above it announced a skip and the feature went
      # untested in CI from the day it shipped. A skip that looks like a pass is the
      # defect, which is the same reasoning that un-gated the Testcontainers tests in
      # pass 14. This instance gets a SMALL quota, its own port, and its own Redis
      # database so the counter starts clean and the earlier harnesses' traffic cannot
      # pre-saturate it (L32 detects that case and skips too).
      - name: Start a throttle-configured instance
        run: |
          nohup java -jar server/target/sudokupro-server-*-exec.jar \
            --spring.profiles.active=dev \
            --server.port=8081 \
            --spring.data.redis.database=3 \
            --sudokupro.security.register.max-attempts=6 \
            --sudokupro.security.register.window-seconds=600 > /tmp/server-throttle.log 2>&1 &
          echo $! > /tmp/server-throttle.pid
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/actuator/health)" = "200" ]; then
              echo "throttle instance healthy after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "::error::throttle instance did not become healthy"; tail -100 /tmp/server-throttle.log; exit 1

      - name: Registration throttle suite — L32 against the small quota
        run: python3 engine/live_engine.py --base http://localhost:8081 --only L32 --registration-quota 6

      - name: Throttle instance log
        if: always()
        run: tail -100 /tmp/server-throttle.log || true

      - name: Stop the throttle instance
        if: always()
        run: kill "$(cat /tmp/server-throttle.pid)" 2>/dev/null || true

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sudokupro:${{ github.sha }} .

  # Release: on a version tag (v*), publish the server jar as a GitHub Release
  # and push the Docker image to GHCR tagged with the version.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, harness, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build server jar
        run: mvn -B -DskipTests -pl server -am package

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          IMAGE=ghcr.io/${{ github.repository_owner }}/sudokupro
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: server/target/sudokupro-server-*-exec.jar
