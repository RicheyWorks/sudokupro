<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- maximum-scale=1 blocked pinch-zoom, a WCAG 1.4.4 failure that matters here because
     the pencil-mark glyphs are tiny. viewport-fit=cover pairs with the safe-area insets. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b14">
<title>SudokuPro — Play</title>
<style>
  :root {
    --bg:#0a0a12; --bg2:#0e0e1c; --panel:#15152a; --panel2:#1b1b34;
    --line:#2a2a48; --line-strong:#3a3a64;
    --accent:#7b5cff; --accent-2:#9d86ff; --gold:#ffd35c; --cyan:#4de3ff;
    --good:#54e6a0; --bad:#ff6b7d; --text:#e9e9f4; --muted:#9a9ac0;
    /* --cell-peer was #15152e: a 5/255 delta against --cell, a 1.16:1 ratio that was
       simply not visible. The peer highlight covers 20 cells and is the main navigational
       aid on the board, so it needs to actually register. */
    --cell:#101026; --cell-given:#191938; --cell-sel:#2a2450; --cell-peer:#1d1d3a;
    --radius:14px; --shadow:0 10px 40px rgba(0,0,0,.45);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; overflow-x:hidden; }
  body {
    margin:0; color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, #1a1440 0%, transparent 55%),
      radial-gradient(1000px 500px at 110% 10%, #0e2a3a 0%, transparent 50%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    /* `fixed` pinned the gradients to the viewport, so everything below the fold was a
       flat slab of --bg2 with a hard seam across it — visible on any phone, where the
       game is roughly 950px tall. It is also janky-to-disabled on iOS Safari. */
    background-attachment:scroll;
    display:flex; flex-direction:column; align-items:center; min-height:100svh;
    -webkit-font-smoothing:antialiased;
  }
  @supports not (height:100svh) { body { min-height:100vh; } }

  /* Touch hygiene: kill the default cyan tap flash, the ~300ms double-tap-zoom delay,
     and text selection when a cell is double-tapped. */
  .cell, .num, .util, button {
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  .sr-only {
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }
  button:focus-visible, .cell:focus-visible, select:focus-visible, input:focus-visible {
    outline:2px solid var(--cyan); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
  }

  header { text-align:center; margin:26px 0 6px; }
  h1 {
    margin:0; font-size:30px; font-weight:800; letter-spacing:4px;
    background:linear-gradient(90deg,var(--gold),var(--accent-2) 60%,var(--cyan));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .tag { color:var(--muted); font-size:12px; letter-spacing:3px; text-transform:uppercase; margin-top:2px; }

  .panel {
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
    border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin:10px; width:min(520px,94vw); box-shadow:var(--shadow);
  }

  label { display:block; font-size:12px; color:var(--muted); margin:8px 2px 2px; }
  input, select {
    width:100%; padding:12px; border-radius:10px; border:1px solid var(--line-strong);
    background:#0d0d20; color:var(--text); font-size:15px; outline:none; transition:border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(123,92,255,.25); }

  button {
    padding:11px 16px; border:none; border-radius:10px; cursor:pointer; color:#fff;
    background:linear-gradient(180deg,var(--accent-2),var(--accent)); font-size:14px; font-weight:600;
    transition:transform .08s ease, filter .15s, opacity .15s;
  }
  button:hover:not(:disabled) { filter:brightness(1.08); }
  button:active:not(:disabled) { transform:translateY(1px) scale(.99); }
  button.secondary { background:linear-gradient(180deg,#33335e,#26264a); }
  button.ghost { background:transparent; border:1px solid var(--line-strong); color:var(--muted); }
  button:disabled { opacity:.4; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row > button { flex:1 1 auto; }

  #btnLogin { width:100%; margin-top:12px; padding:13px; font-size:15px; }
  #login .alt { display:flex; gap:8px; margin-top:8px; }
  #login .alt button { flex:1; }

  #status { min-height:20px; margin-top:10px; font-size:13px; color:var(--muted); text-align:center; }
  #status.err { color:var(--bad); } #status.ok { color:var(--good); }

  #game { display:none; flex-direction:column; align-items:center; width:min(520px,94vw); }

  /* HUD */
  /* `repeat(5,1fr)` is `minmax(auto,1fr)`, so no track could shrink below its
     min-content width — a long player name alone forced the row to ~390px and the page
     scrolled sideways on every phone (measured 396-398px against a 320-390px viewport,
     with the Exit button's right edge off-screen at x=395.7). minmax(0,1fr) plus a
     truncating value lets the tracks actually shrink. */
  #hud { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; width:100%; }
  .stat { background:#12122a; border:1px solid var(--line); border-radius:12px; padding:8px 6px; text-align:center; min-width:0; }
  .stat .k { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
  .stat .v { font-size:18px; font-weight:700; color:var(--cyan); margin-top:2px;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stat .v.gold { color:var(--gold); }
  #hudConn.live { color:var(--good); } #hudConn.down { color:var(--bad); }

  .controls { display:flex; gap:8px; margin-top:12px; align-items:stretch; flex-wrap:wrap; }
  .controls select { flex:1.2 1 120px; min-width:0; }
  .controls button { flex:1 1 88px; min-width:0; }

  @media (max-width:420px) {
    #hud { grid-template-columns:repeat(4,minmax(0,1fr)); }
    #hud .stat:first-child { grid-column:1 / -1; }  /* the name gets its own row */
    /* Nine buttons across a 320px screen gave 28px tap targets, well under the 44px
       minimum. Five columns brings them to ~55px. */
    #nums { grid-template-columns:repeat(5,1fr) !important; }
    .num { padding:14px 0 !important; }
  }

  /* Board */
  #boardWrap { position:relative; margin:14px 0 6px; }
  #board {
    display:grid; grid-template-columns:repeat(9,1fr); gap:0; width:min(486px,92vw); aspect-ratio:1;
    background:var(--line-strong); border:3px solid var(--accent); border-radius:10px; overflow:hidden;
    box-shadow:var(--shadow);
  }
  .cell {
    position:relative; display:flex; align-items:center; justify-content:center;
    font-size:clamp(18px,5.2vw,26px); font-weight:600; color:var(--accent-2);
    background:var(--cell); border:1px solid var(--line); cursor:pointer;
    transition:background .12s, color .12s;
  }
  .cell.given { color:var(--gold); font-weight:800; background:var(--cell-given); cursor:default; }
  .cell.peer { background:var(--cell-peer); }
  .cell.same { background:#22203f; color:#fff; }
  .cell.sel { background:var(--cell-sel); box-shadow:inset 0 0 0 2px var(--cyan); color:#fff; }
  /* Conflict carries a glyph as well as colour — red-on-gold-on-purple is not separable
     under deuteranopia, and colour alone fails WCAG 1.4.1. */
  .cell.conflict { color:var(--bad) !important; }
  .cell.conflict::after {
    content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 50%, rgba(255,107,125,.28), transparent 70%);
  }
  /* A rejected move: the server validates and wipes the optimistic value faster than a
     frame, so the only feedback used to be a toast reading "Server: Invalid move" with no
     indication of which cell. Flash the cell itself instead. */
  .cell.reject { animation:shake .35s ease; color:var(--bad) !important; }
  .cell.reject::after {
    content:"✕"; position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; color:var(--bad); font-size:1.4em; opacity:.55;
    background:radial-gradient(circle at 50% 50%, rgba(255,107,125,.22), transparent 70%);
  }
  @keyframes shake {
    0%,100% { transform:translateX(0); }
    25% { transform:translateX(-3px); }
    75% { transform:translateX(3px); }
  }
  /* 3×3 block separators — deliberately strong: reading the boxes at a glance
     is the whole point of a Sudoku grid. */
  .cell.b-right { border-right:3px solid var(--accent); }
  .cell.b-bottom { border-bottom:3px solid var(--accent); }
  .cell .notes { position:absolute; inset:2px; display:grid; grid-template-columns:repeat(3,1fr);
    font-size:9px; color:var(--muted); font-weight:600; line-height:1; pointer-events:none; }
  .cell .notes span { display:flex; align-items:center; justify-content:center; }
  .cell.solvedflash { animation:flash .6s ease; }
  @keyframes flash { 0%{background:var(--good);color:#04240f;} 100%{} }

  /* The victory overlay now shows the solve time — for a puzzle game that is the number
     people actually care about, and it was previously visible only in a ghost button that
     the next New game silently reset. */
  #boardWrap.solved::before {
    content:"✦ SOLVED ✦\A" attr(data-time); white-space:pre; text-align:center; line-height:1.5;
    position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:800; letter-spacing:3px; color:var(--gold);
    background:rgba(10,10,20,.55); backdrop-filter:blur(2px); border-radius:10px;
    animation:pop .4s ease;
  }
  @keyframes pop { from{transform:scale(.85);opacity:0;} to{transform:scale(1);opacity:1;} }

  /* An empty board used to render as a bare purple rectangle — the very first thing you
     see after logging in, and it reads as a crash. */
  .board-empty {
    grid-column:1/-1; grid-row:1/-1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px; color:var(--muted);
    font-size:14px; line-height:1.9; text-align:center; padding:20px; background:var(--cell);
  }
  .board-empty b { color:var(--accent-2); }

  /* Busy state: every async button was double-submittable, with no feedback between the
     click and the response. Three fast clicks on New created three server-side games. */
  button.busy { position:relative; color:transparent !important; }
  button.busy::after {
    content:""; position:absolute; inset:0; margin:auto; width:16px; height:16px;
    border:2px solid rgba(255,255,255,.3); border-top-color:#fff;
    border-radius:50%; animation:spin .6s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Pad — digits sit in one row of 9, aligned under the board's 9 columns;
     utilities get their own row so nothing orphans onto a third line. */
  #pad { width:min(486px,92vw); margin-top:6px; }
  #nums { display:grid; grid-template-columns:repeat(9,1fr); gap:5px; }
  #utils { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .num { position:relative; padding:14px 0; font-size:clamp(15px,4vw,19px); font-weight:700;
    background:#181834; border:1px solid var(--line-strong); border-radius:9px; }
  .num:hover:not(:disabled) { background:#22224a; }
  /* 8.5px was unreadable and the badge visually collided with the digit — "4" over "1"
     read as "41". 11px with a little breathing room. */
  .num .rem { position:absolute; top:3px; right:5px; font-size:11px; line-height:1;
    color:var(--muted); font-weight:600; }
  .num.done, .num:disabled { opacity:.32; cursor:default; }
  .util { padding:13px 0; font-size:15px; }
  #btnNotes.on { background:linear-gradient(180deg,var(--cyan),#2aa8c4); color:#03202a; }

  /* Toast + log */
  #toast { position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(24px);
    background:var(--panel2); border:1px solid var(--line-strong); color:var(--text);
    padding:11px 18px; border-radius:12px; font-size:14px; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:50; max-width:90vw; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.good { border-color:var(--good); } #toast.bad { border-color:var(--bad); }

  details.logbox { width:min(486px,92vw); margin:10px 0 30px; }
  details.logbox summary { cursor:pointer; color:var(--muted); font-size:12px; letter-spacing:1px; text-transform:uppercase; }
  #log { font-size:12.5px; color:var(--muted); max-height:150px; overflow-y:auto; margin-top:8px;
    white-space:pre-wrap; line-height:1.5; }

  .hintline { margin-top:10px; font-size:13px; color:var(--cyan); min-height:18px; text-align:center; }
  /* #55557a measured 2.70:1 — below the 4.5:1 AA floor. */
  .foot { color:#7b7ba4; font-size:12px; margin-bottom:24px; }

  /* Saved-games modal */
  .modal-back { position:fixed; inset:0; background:rgba(5,5,12,.72); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:60; padding:16px; }
  .modal-back.show { display:flex; }
  .modal-card { background:linear-gradient(180deg,var(--panel),var(--panel2)); border:1px solid var(--line-strong);
    border-radius:var(--radius); box-shadow:var(--shadow); width:min(460px,94vw); max-height:80svh; overflow:auto; padding:18px; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
    font-weight:700; letter-spacing:1px; color:var(--gold); }
  .save-row { display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:#12122a; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .save-row .meta { font-size:12px; color:var(--muted); }
  .save-row .meta b { color:var(--text); font-size:13px; display:block; margin-bottom:2px; }
  /* 36px tall was under the 44px tap-target minimum. */
  .save-row button { padding:12px 18px; font-size:13px; min-height:44px; }
  .empty { color:var(--muted); font-size:13px; text-align:center; padding:18px 0; }

  /* Stats modal: tabs + ranked rows */
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; padding:8px 6px; font-size:12.5px; background:#12122a;
    border:1px solid var(--line); color:var(--muted); }
  .tabs button.on { background:linear-gradient(180deg,var(--accent-2),var(--accent)); color:#fff; border-color:transparent; }
  .rank-row { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
    background:#12122a; border:1px solid var(--line); margin-bottom:6px; font-size:13px; }
  .rank-row .pos { width:26px; text-align:center; font-weight:800; color:var(--muted); }
  .rank-row .pos.top { color:var(--gold); }
  .rank-row .who { flex:1; font-weight:600; }
  .rank-row .who.me { color:var(--cyan); }
  .rank-row .val { color:var(--gold); font-weight:700; font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; padding:5px 10px; margin:0 6px 6px 0; border-radius:999px;
    background:#1d1d3d; border:1px solid var(--line-strong); font-size:12px; color:var(--text); }
  .badge.locked { opacity:.35; }
</style>
</head>
<body>
  <header>
    <h1>SUDOKUPRO</h1>
    <div class="tag">cosmic sudoku duels</div>
  </header>

  <div class="panel" id="login">
    <!-- A real <form>: without one there is no implicit submission, so Enter did nothing
         on the login screen, and password managers had nothing to offer to save. -->
    <form id="loginForm" novalidate>
      <label for="user">Username</label>
      <input id="user" placeholder="your name" autocomplete="username">
      <label for="pass">Password</label>
      <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
      <button id="btnLogin" type="submit">Log in &amp; Play</button>
      <div class="alt">
        <button id="btnRegister" type="button" class="secondary">Create account</button>
      </div>
    </form>
    <details class="logbox" style="margin-top:12px;">
      <summary>Advanced</summary>
      <label for="server">Server</label>
      <input id="server" value="" placeholder="Default: this origin">
    </details>
    <div id="status" role="status" aria-live="polite"></div>
  </div>

  <div id="game">
    <div class="panel" style="width:min(486px,92vw);">
      <div id="hud">
        <div class="stat"><div class="k">Player</div><div class="v gold" id="hudPlayer">–</div></div>
        <div class="stat"><div class="k">Gems</div><div class="v" id="hudGems">–</div></div>
        <div class="stat"><div class="k">Level</div><div class="v" id="hudLevel">–</div></div>
        <div class="stat"><div class="k">Moves</div><div class="v" id="hudMoves">0</div></div>
        <div class="stat"><div class="k">Streak</div><div class="v" id="hudStreak">–</div></div>
        <div class="stat"><div class="k">Time</div><div class="v" id="hudTime">00:00</div></div>
        <div class="stat"><div class="k">Link</div><div class="v" id="hudConn">–</div></div>
      </div>
      <div class="controls">
        <select id="difficulty" aria-label="Difficulty">
          <option value="1">Easy</option>
          <option value="2" selected>Medium</option>
          <option value="3">Hard</option>
          <option value="4">Insane</option>
        </select>
        <button id="btnNew">New</button>
        <button id="btnDaily" class="secondary">Daily</button>
      </div>
      <div class="controls" style="margin-top:8px;">
        <button id="btnUndo" class="ghost" title="Undo (Ctrl+Z)">↶ Undo</button>
        <button id="btnRedo" class="ghost" title="Redo (Ctrl+Y)">↷ Redo</button>
        <button id="btnHint" class="ghost">💡 Hint</button>
      </div>
      <div class="controls" style="margin-top:8px;">
        <button id="btnSave" class="ghost">💾 Save</button>
        <button id="btnLoad" class="ghost">📂 Load</button>
        <button id="btnStats" class="ghost">🏆 Stats</button>
        <button id="btnLogout" class="ghost">Exit</button>
      </div>
      <div class="hintline" id="hintline"></div>
    </div>

    <div id="boardWrap"><div id="board" role="grid" aria-label="Sudoku board"></div></div>
    <div id="pad"></div>

    <details class="logbox">
      <summary>Event log</summary>
      <div id="log"></div>
    </details>
  </div>

  <div id="modal" class="modal-back" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-head">
        <span id="modalTitle">Saved games</span>
        <button id="modalClose" class="ghost" aria-label="Close dialog"
                style="padding:10px 14px;min-width:44px;min-height:44px;">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="srAnnounce" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
  <div class="foot">REST + WebSocket · same API as the desktop client</div>

  <script src="app.js"></script>
</body>
</html>
