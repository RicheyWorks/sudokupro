# ─── Profiles ───────────────────────────────────────────────────────────────────
# Bare local runs default to "dev" (working defaults, ddl-auto=update).
# Production MUST set SPRING_PROFILES_ACTIVE=prod — outside dev/test, SecretsGuard
# refuses to start on missing or well-known credentials. (AUDIT P0-2 / P0-3)
spring.profiles.default=dev

# ─── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sudokupro}
spring.datasource.username=${DB_USERNAME:postgres}
# No fallback: outside the dev profile the password must be provided explicitly.
spring.datasource.password=${DB_PASSWORD:}

# DDL strategy: "validate" so Hibernate never silently alters a production schema.
# Flyway owns the schema (see db/migration). The dev profile disables Flyway and
# uses ddl-auto=update for local iteration. (AUDIT P0-3)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
# Existing pre-Flyway databases: mark V1 (baseline schema) as already applied and
# run V2+ only. Fresh databases run everything.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ─── Redis ──────────────────────────────────────────────────────────────────────
# Boot 3 canonical namespace (spring.data.redis.*) — the old spring.redis.* keys
# were silently ignored by autoconfiguration. (AUDIT P1-4)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# ─── Spring Security default user ───────────────────────────────────────────────
# No fallback password: outside the dev profile ADMIN_PASSWORD must be provided
# explicitly and must not be a well-known value. In production remove these
# entirely and provision real accounts via the DB.
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:}
spring.security.user.roles=ADMIN

# ─── Push notifications (FCM HTTP v1) ───────────────────────────────────────────
# Replaces the legacy server-key API removed under AUDIT P1-5. Disabled unless a
# service-account key is provided; when enabled, startup fails fast on a missing
# or malformed key (SecretsGuard philosophy). Device tokens are registered per
# player via POST /api/notifications/device-token.
sudokupro.fcm.enabled=${FCM_ENABLED:false}
sudokupro.fcm.service-account-file=${FCM_SERVICE_ACCOUNT_FILE:}

# ─── Proxy-aware client addressing ──────────────────────────────────────────────
# The brute-force lockout (LoginAttemptLimiter + LoginAttemptFilter) keys on
# request.getRemoteAddr(), and so does Spring Security's WebAuthenticationDetails,
# which feeds the same counter. Behind the Kubernetes Service / ingress every user
# arrives from ONE source address, so without this a single attacker's five bad
# passwords would lock out the entire player base — and legitimate per-client
# limiting would not work at all. (Observed: a load-test run immediately after a
# brute-force probe had all 25 players fail at /api/session.)
#
# Defaults to NONE. The previous default was NATIVE, and the reasoning above it was
# wrong in the one environment this app actually ships to. RemoteIpValve honours
# X-Forwarded-For when the IMMEDIATE PEER is a private-range address — and in Kubernetes
# the immediate peer is always a private address (the pod or node IP via kube-proxy),
# while the shipped manifests contain only a ClusterIP Service with no ingress appending
# a real client IP. So the header was attacker-controlled end to end, which gave two
# things: unlimited unauthenticated password guessing by rotating the header per attempt
# (verified: 12 attempts, no 429), and a targeted denial of service — stamp five bad
# logins with a victim's egress IP and that IP is locked out of the whole API, since
# LoginAttemptFilter returns 429 before authentication so even correct credentials fail.
#
# Set FORWARD_HEADERS_STRATEGY=NATIVE only when there is genuinely a trusted proxy in
# front that APPENDS the real client address (then the valve walks right-to-left and
# picks it correctly). Deploying without one and trusting the header is worse than not
# reading it at all.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:NONE}

# ─── Health groups for Kubernetes probes ────────────────────────────────────────
# LIVENESS answers "is this JVM wedged?" and must NOT depend on external systems.
# Both probes previously hit the aggregate /actuator/health, which includes the
# Redis indicator — so a transient Redis blip made every pod report 503 and got the
# whole deployment crash-looped, directly contradicting the "degrade gracefully
# without Redis" design (and the app really does degrade: local locking, in-memory
# stores). Liveness now covers only the game engine self-test; readiness keeps the
# dependency checks, so a pod is pulled from the Service without being killed.
management.endpoint.health.group.liveness.include=gameEngine
management.endpoint.health.group.readiness.include=db,redis,gameEngine
management.endpoint.health.group.readiness.show-details=when-authorized
